# Built from the Unraid template in junkerderprovinz/unraid-apps by
# .github/gen-compose.py. Change the template there, not this file.
#
# Folders are created next to this file on the first start. Point the ones
# that hold your own files (downloads, storage and the like) at real folders
# first, and fill in every value marked "required".

services:
  filebot:
    image: junkerderprovinz/filebot:latest@sha256:c8685f7702f519fb08024bba34cfd6b1ac547a77221faa440b7a720fae1bdcfc
    container_name: filebot
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3001:3001"
      - "3000:3000"
    volumes:
      - "./appdata:/config"
      - "./storage:/storage"
    environment:
      TZ: Europe/Vienna
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      FILEBOT_THEME: Darcula
      AMC_ENABLED: "0"
      AMC_INPUT_DIR: /watch
      AMC_OUTPUT_DIR: /output
      AMC_ACTION: test
      AMC_CONFLICT: auto
      AMC_MATCH_MODE: opportunistic
      AMC_LANG: English
      AMC_INTERVAL: "1800"
      AMC_INPUT_STABLE_TIME: "10"
      AMC_PROCESS_MUSIC: y
      AMC_ARTWORK: n
